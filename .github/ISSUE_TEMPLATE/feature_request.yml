name: 💡 Feature Request
description: Suggest an enhancement or new capability for Genius AI
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love new ideas! Make sure to review the [Cognitive State Graph (CSG v2.0) Architecture](SPECIFICATION.md) to ensure your feature aligns with our performance and zero-cost mandates.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a problem or limitation? Please describe.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & Architecture
      description: Describe the solution you'd like to see implemented.
      placeholder: Introduce a new Cognitive State Graph node or CLI command that...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariant Compatibility
      description: Confirm this proposal complies with Genius AI invariants.
      options:
        - label: Preserves strictly free-tier model operation (no mandatory paid API requirements).
          required: true
        - label: Maintains low-resource hardware compatibility (< 350MB RSS memory).
          required: true
