name: CI Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Bytecode compilation sanity check
        run: |
          python -m compileall src/

      - name: Run unit test suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --ignore=tests/test_model_live.py --ignore=tests/benchmark_runtime.py

      - name: Verify FastPath and Resource Manager initialization
        env:
          PYTHONPATH: .
        run: |
          python -c "from src.system.genius_runtime import FastPathShortCircuit; assert FastPathShortCircuit.classify('hi') is not None; print('FastPath OK')"
          python -c "from src.system.resource_manager import get_resource_manager; rm = get_resource_manager(); print('Profile:', rm.profile.tier.value); print('Resource Manager OK')"
