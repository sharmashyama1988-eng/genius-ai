[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genius-ai"
version = "1.0.0"
description = "Autonomous Deep-Reasoning & Factual Grounding AI Agent with Live Wikipedia Retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Genius AI Team" }
]
keywords = [
    "artificial-intelligence",
    "deep-reasoning",
    "epistemic-grounding",
    "xthinking",
    "wikipedia-retrieval",
    "hinglish",
    "edge-ai",
    "qwen2.5"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "duckduckgo_search>=7.0.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "tokenizers>=0.19.0"
]

[project.optional-dependencies]
cloud = [
    "anthropic>=0.30.0",
    "openai>=1.30.0",
    "litellm>=1.40.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
genius = "src.chat_cli:main"
